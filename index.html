<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Swedish Fish</title>
<meta name="description" content="A pile of interactive WebGPU gummy fish you can grab, stretch, flop and flip.">
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed WebGPU stage; specimen panel docks right (bottom sheet on phones). */
:root {
  --paper: #f3eae5;
  --ink: #2a181b;
  --ink-soft: #6f5a5b;
  --rule: rgba(42, 24, 27, 0.13);
  --sheet: rgba(251, 246, 243, 0.80);
  --accent: #c8142c;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

.panel { position: fixed; right: clamp(16px, 2.2vw, 32px); top: calc(env(safe-area-inset-top, 0px) + clamp(16px, 3vh, 32px)); width: 286px; max-height: calc(100% - 2 * clamp(16px, 3vh, 32px) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: auto;
  background: var(--sheet); -webkit-backdrop-filter: blur(16px) saturate(1.1); backdrop-filter: blur(16px) saturate(1.1); border: 1px solid var(--rule); border-radius: 3px; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; }
.panel.is-off { display: none; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
.panel-title { font: 500 11px/1 var(--mono); letter-spacing: 0.22em; margin: 0; }
.panel-meta { font: 400 10px/1 var(--mono); letter-spacing: 0.08em; color: var(--ink-soft); }
.group { display: flex; flex-direction: column; gap: 9px; }
.label { font: 500 10px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin: 0; }

.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.swatch { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid transparent; border-radius: 2px; font: 500 13px/1 var(--body); color: var(--ink); }
.swatch:hover { background: rgba(42, 24, 27, 0.04); }
.swatch:active { border-color: var(--ink); }
.swatch:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.chip { width: 16px; height: 11px; border-radius: 6px 3px 3px 6px; background: var(--c); box-shadow: inset 0 -2px 3px rgba(0,0,0,.22), inset 0 1px 1px rgba(255,255,255,.45); flex: none; position: relative; }
.chip::after { content: ""; position: absolute; right: -4px; top: 1px; border-left: 5px solid var(--c); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }

.slider { display: flex; flex-direction: column; gap: 6px; }
.slider-row { display: flex; justify-content: space-between; align-items: baseline; }
.slider-row label { font: 500 13px/1 var(--body); }
.slider-row output { font: 400 11px/1 var(--mono); color: var(--ink-soft); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(var(--ink), var(--ink)) 0 / var(--p, 50%) 100% no-repeat, var(--rule); }
input[type=range]::-moz-range-track { height: 2px; background: var(--rule); }
input[type=range]::-moz-range-progress { height: 2px; background: var(--ink); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #fbf6f3; box-shadow: 0 0 0 1px var(--ink); margin-top: -6px; transition: background .4s; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid #fbf6f3; box-shadow: 0 0 0 1px var(--ink); }
input[type=range]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn { all: unset; box-sizing: border-box; cursor: pointer; text-align: center; padding: 9px 6px; font: 500 12.5px/1.1 var(--body); color: var(--ink); border: 1px solid var(--rule); border-radius: 2px; background: rgba(255,255,255,.35); transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--ink); }
.btn:active { background: rgba(42,24,27,.07); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.btn.primary { background: var(--ink); color: #fbf6f3; border-color: var(--ink); }
.btn.primary:hover { background: #432a2e; }
.btn.wide { grid-column: 1 / -1; }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

.toggles { display: flex; gap: 18px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font: 500 13px/1 var(--body); cursor: pointer; user-select: none; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch { width: 26px; height: 14px; border-radius: 8px; background: var(--rule); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fbf6f3; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
.toggle input:checked + .switch { background: var(--ink); }
.toggle input:checked + .switch::after { transform: translateX(12px); }
.toggle input:focus-visible + .switch { outline: 2px solid var(--ink); outline-offset: 2px; }

.readouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding-top: 12px; border-top: 1px solid var(--rule); }
.readouts div { min-width: 0; }
.readouts dt { font: 500 9.5px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
.readouts dd { margin: 0; font: 400 13px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

.fallback { position: fixed; left: 50%; top: 52%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px)); box-sizing: border-box; background: #fbf6f3; border: 1px solid var(--rule); padding: 22px 24px; border-radius: 3px; }
.fallback h2 { font: italic 400 28px/1.1 var(--display); margin: 0 0 10px; }
.fallback p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-soft); }

@media (max-width: 759px) {
  .panel { top: auto; right: 12px; left: 12px; width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-height: 46%; padding: 12px 14px 14px; gap: 11px; }
  .panel-head { padding-bottom: 9px; }
  .swatches { grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .swatch { flex-direction: column; gap: 5px; padding: 6px 2px; font-size: 11px; text-align: center; }
  .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .buttons { grid-template-columns: repeat(3, 1fr); }
  .btn { padding: 9px 4px; font-size: 12px; }
  .btn.wide { grid-column: span 2; }
  .group-label-hide { display: none; }
  .readouts { padding-top: 9px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="stage" aria-label="A pile of interactive 3D gummy fish. Drag a fish to stretch it; drag elsewhere to orbit."></canvas>

<aside class="panel" id="panel" aria-label="The specimen controls">
  <div class="panel-head">
    <h2 class="panel-title">THE CATCH</h2>
    <span class="panel-meta">1 unit = 2 cm</span>
  </div>

  <div class="group">
    <p class="label group-label-hide">Drop in a fish</p>
    <div class="swatches" role="group" aria-label="Drop in a fish">
      <button class="swatch" data-flavor="red" style="--c:#c8142c"><span class="chip"></span>Classic Red</button>
      <button class="swatch" data-flavor="lemon" style="--c:#e9b80c"><span class="chip"></span>Lemon</button>
      <button class="swatch" data-flavor="tangerine" style="--c:#ee6a12"><span class="chip"></span>Tangerine</button>
      <button class="swatch" data-flavor="lime" style="--c:#4f9c1d"><span class="chip"></span>Lime</button>
    </div>
  </div>

  <div class="sliders group">
    <div class="slider">
      <div class="slider-row"><label for="firmness">Chewiness</label><output id="firmness-val" for="firmness">Firm</output></div>
      <input type="range" id="firmness" min="0" max="100" value="70">
    </div>
    <div class="slider">
      <div class="slider-row"><label for="damping">Internal damping</label><output id="damping-val" for="damping">Settled</output></div>
      <input type="range" id="damping" min="0" max="100" value="80">
    </div>
  </div>

  <div class="buttons">
    <button class="btn primary" id="btn-nudge">Give them a nudge</button>
    <button class="btn" id="btn-flop">Make them flop</button>
    <button class="btn" id="btn-turn">Turn them over</button>
    <button class="btn" id="btn-reset">Reset</button>
    <button class="btn wide" id="btn-pause" aria-pressed="false">Pause</button>
  </div>

  <div class="toggles">
    <label class="toggle"><input type="checkbox" id="tog-slow"><span class="switch"></span>¼ speed</label>
    <label class="toggle"><input type="checkbox" id="tog-mesh"><span class="switch"></span>Show mesh</label>
  </div>

  <dl class="readouts" aria-live="off">
    <div><dt>Fish</dt><dd id="ro-count">0</dd></div>
    <div><dt>Mass</dt><dd id="ro-mass">—</dd></div>
    <div><dt>Kinetic</dt><dd id="ro-ke">0.00 µJ</dd></div>
  </dl>
</aside>

<div class="fallback" id="fallback" hidden>
  <h2>WebGPU isn't available here.</h2>
  <p id="fallback-detail">These specimens are rendered and simulated with WebGPU. Open it in a recent Chrome, Edge or Safari on a device with GPU support.</p>
</div>

<script>
'use strict';
// ---------- Shape: outline, SDF, thickness profile ----------
// Fish-local 2D coords: X along body (head at +X), W across (dorsal at +W).
// Model coords: M = (X, T, -W)  — T is thickness axis (world up when lying flat).
const FISH_CTRL = [
  [1.075, -0.021], [1.012, 0.125], [0.846, 0.229], [0.575, 0.308], [0.262, 0.371],
  [0.012, 0.385], [-0.237, 0.358], [-0.467, 0.292], [-0.675, 0.208],
  [-0.862, 0.250], [-1.060, 0.300], [-1.165, 0.250], [-1.165, 0.083],
  [-1.144, -0.021], [-1.175, -0.180], [-1.140, -0.300], [-1.020, -0.310],
  [-0.821, -0.229], [-0.696, -0.198], [-0.467, -0.281], [-0.196, -0.365],
  [0.096, -0.392], [0.429, -0.375], [0.721, -0.323], [0.929, -0.219], [1.044, -0.125]
];
const RIM = 0.12;   // wide rounded rim: the candy reads as a soft, pillowy lozenge

function smoothstep(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

function buildOutline() {
  const P = FISH_CTRL, n = P.length, out = [], per = 12;
  for (let i = 0; i < n; i++) {
    const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
    for (let s = 0; s < per; s++) {
      const t = s / per, t2 = t * t, t3 = t2 * t;
      const f = k => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      out.push([f(0), f(1)]);
    }
  }
  return out;
}

function buildSDF(outline) {
  const step = 0.008, x0 = -1.32, w0 = -0.62;
  const nx = Math.ceil(2.56 / step) + 1, nw = Math.ceil(1.30 / step) + 1;
  const data = new Float32Array(nx * nw);
  const m = outline.length;
  const ax = new Float32Array(m), ay = new Float32Array(m), bx = new Float32Array(m), by = new Float32Array(m);
  for (let k = 0; k < m; k++) { const a = outline[k], b = outline[(k + 1) % m]; ax[k] = a[0]; ay[k] = a[1]; bx[k] = b[0]; by[k] = b[1]; }
  for (let j = 0; j < nw; j++) {
    const W = w0 + j * step;
    for (let i = 0; i < nx; i++) {
      const X = x0 + i * step;
      let best = 1e9, inside = false;
      for (let k = 0; k < m; k++) {
        const ex = bx[k] - ax[k], ey = by[k] - ay[k];
        const px = X - ax[k], py = W - ay[k];
        let t = (px * ex + py * ey) / (ex * ex + ey * ey); t = t < 0 ? 0 : t > 1 ? 1 : t;
        const dx = px - ex * t, dy = py - ey * t, d2 = dx * dx + dy * dy;
        if (d2 < best) best = d2;
        if ((ay[k] > W) !== (by[k] > W) && X < ax[k] + (W - ay[k]) / (by[k] - ay[k]) * ex) inside = !inside;
      }
      data[i + j * nx] = inside ? Math.sqrt(best) : -Math.sqrt(best);
    }
  }
  return { step, x0, w0, nx, nw, data };
}

let SDF = null;
function sampleD(X, W) {
  const s = SDF; let fx = (X - s.x0) / s.step, fw = (W - s.w0) / s.step;
  if (fx < 0 || fw < 0 || fx > s.nx - 1.001 || fw > s.nw - 1.001) return -1;
  const i = Math.floor(fx), j = Math.floor(fw); fx -= i; fw -= j;
  const d = s.data, k = i + j * s.nx;
  return (d[k] * (1 - fx) + d[k + 1] * fx) * (1 - fw) + (d[k + s.nx] * (1 - fx) + d[k + s.nx + 1] * fx) * fw;
}
function gradD(X, W) {
  const e = 0.006;
  return [(sampleD(X + e, W) - sampleD(X - e, W)) / (2 * e), (sampleD(X, W + e) - sampleD(X, W - e)) / (2 * e)];
}
function halfThick(X, W) {
  const ex = (X - 0.02) / 1.08, ew = W / 0.40;
  const e = 1 - ex * ex - ew * ew;
  return 0.057 + (0.165 - 0.057) * smoothstep(-0.55, 0.65, e);
}
function surfZ(X, W) {
  const d = sampleD(X, W); if (d <= 0) return 0;
  const t = Math.min(d / RIM, 1);
  return halfThick(X, W) * Math.sqrt(Math.max(0, 2 * t - t * t));
}

// ---------- Visual surface ----------
function buildVisual() {
  const g = 0.0105;
  const X0 = -1.215, X1 = 1.105, W0 = -0.44, W1 = 0.43;
  const nx = Math.ceil((X1 - X0) / g) + 1, nw = Math.ceil((W1 - W0) / g) + 1;
  const D = new Float32Array(nx * nw);
  for (let j = 0; j < nw; j++) for (let i = 0; i < nx; i++) D[i + j * nx] = sampleD(X0 + i * g, W0 + j * g);
  const cellIn = new Uint8Array((nx - 1) * (nw - 1));
  const used = new Uint8Array(nx * nw);
  for (let j = 0; j < nw - 1; j++) for (let i = 0; i < nx - 1; i++) {
    const a = i + j * nx;
    if (D[a] > 0 || D[a + 1] > 0 || D[a + nx] > 0 || D[a + nx + 1] > 0) {
      cellIn[i + j * (nx - 1)] = 1; used[a] = used[a + 1] = used[a + nx] = used[a + nx + 1] = 1;
    }
  }
  const pos = [], nrm = [];
  const idxF = new Int32Array(nx * nw).fill(-1), idxB = new Int32Array(nx * nw).fill(-1);
  function restNormal(X, W, d, side) {
    const [gx0, gw0] = gradD(X, W); const gl = Math.hypot(gx0, gw0) || 1; const gx = gx0 / gl, gw = gw0 / gl;
    const ht = halfThick(X, W);
    const e = 0.01; const hX = (halfThick(X + e, W) - halfThick(X - e, W)) / (2 * e), hW = (halfThick(X, W + e) - halfThick(X, W - e)) / (2 * e);
    const t = Math.min(Math.max(d, 0) / RIM, 1); const s = Math.sqrt(Math.max(0, 2 * t - t * t));
    let nX, nT, nW;
    if (t < 1) { const k = ht * (1 - t) / RIM; nX = -k * gx - s * s * hX; nT = s; nW = -k * gw - s * s * hW; }
    else { nX = -hX; nT = 1; nW = -hW; }
    const l = Math.hypot(nX, nT, nW) || 1;
    return [nX / l, side * nT / l, -nW / l];
  }
  for (let j = 0; j < nw; j++) for (let i = 0; i < nx; i++) {
    const k = i + j * nx; if (!used[k]) continue;
    let X = X0 + i * g, W = W0 + j * g, d = D[k];
    if (d < 0.38 * g) {
      for (let it = 0; it < 5; it++) {
        const dd = sampleD(X, W); const [gx, gw] = gradD(X, W); const l = Math.hypot(gx, gw) || 1;
        X -= gx / l * dd; W -= gw / l * dd;
      }
      d = 0;
    }
    const z = d <= 0 ? 0 : surfZ(X, W);
    idxF[k] = pos.length / 3; pos.push(X, z, -W); nrm.push(...restNormal(X, W, d, 1));
    if (d <= 0) idxB[k] = idxF[k];
    else { idxB[k] = pos.length / 3; pos.push(X, -z, -W); nrm.push(...restNormal(X, W, d, -1)); }
  }
  const tris = [];
  function addTri(a, b, c) {
    const ax = pos[a * 3], ay = pos[a * 3 + 1], az = pos[a * 3 + 2];
    const ux = pos[b * 3] - ax, uy = pos[b * 3 + 1] - ay, uz = pos[b * 3 + 2] - az;
    const vx = pos[c * 3] - ax, vy = pos[c * 3 + 1] - ay, vz = pos[c * 3 + 2] - az;
    const cx = uy * vz - uz * vy, cy = uz * vx - ux * vz, cz = ux * vy - uy * vx;
    const area = Math.hypot(cx, cy, cz); if (area < 1e-9) return;
    const nx_ = nrm[a * 3] + nrm[b * 3] + nrm[c * 3], ny_ = nrm[a * 3 + 1] + nrm[b * 3 + 1] + nrm[c * 3 + 1], nz_ = nrm[a * 3 + 2] + nrm[b * 3 + 2] + nrm[c * 3 + 2];
    if (cx * nx_ + cy * ny_ + cz * nz_ >= 0) tris.push(a, b, c); else tris.push(a, c, b);
  }
  for (let j = 0; j < nw - 1; j++) for (let i = 0; i < nx - 1; i++) {
    if (!cellIn[i + j * (nx - 1)]) continue;
    const a = i + j * nx, b = a + 1, c = a + nx + 1, d = a + nx;
    // pick diagonal that avoids the shortest-span crease
    const diag = (i + j) & 1;
    for (const L of [idxF, idxB]) {
      if (diag) { addTri(L[a], L[b], L[c]); addTri(L[a], L[c], L[d]); }
      else { addTri(L[a], L[b], L[d]); addTri(L[b], L[c], L[d]); }
    }
  }
  // rest volume (divergence theorem)
  let vol = 0;
  for (let t = 0; t < tris.length; t += 3) {
    const a = tris[t] * 3, b = tris[t + 1] * 3, c = tris[t + 2] * 3;
    vol += (pos[a] * (pos[b + 1] * pos[c + 2] - pos[b + 2] * pos[c + 1]) - pos[a + 1] * (pos[b] * pos[c + 2] - pos[b + 2] * pos[c]) + pos[a + 2] * (pos[b] * pos[c + 1] - pos[b + 1] * pos[c])) / 6;
  }
  return { pos: new Float32Array(pos), nrm: new Float32Array(nrm), idx: new Uint32Array(tris), volume: vol };
}

// ---------- Simulation lattice ----------
// Coarser than a lone fish would need (0.12 vs 0.09) so a pile of ten still simulates inside a frame.
const LAT = { ox: -1.26, oy: -0.18, oz: -0.585, hx: 0.12, hy: 0.12, hz: 0.12, nx: 21, ny: 3, nz: 9 };

function buildLattice(totalMass) {
  const L = LAT, { nx, ny, nz } = L;
  const cellOf = new Int32Array(nx * ny * nz).fill(-1);
  const cells = [], fill = [];
  const S = 6;
  for (let iz = 0; iz < nz; iz++) for (let iy = 0; iy < ny; iy++) for (let ix = 0; ix < nx; ix++) {
    let hits = 0;
    for (let a = 0; a <= S; a++) for (let b = 0; b <= S; b++) for (let c = 0; c <= S; c++) {
      const X = L.ox + (ix + a / S) * L.hx, T = L.oy + (iy + b / S) * L.hy, W = -(L.oz + (iz + c / S) * L.hz);
      if (sampleD(X, W) > -0.004 && Math.abs(T) <= surfZ(X, W) + 0.004) hits++;
    }
    if (hits > 0) { cellOf[ix + nx * (iy + ny * iz)] = cells.length; cells.push([ix, iy, iz]); fill.push(hits / ((S + 1) ** 3)); }
  }
  const NX = nx + 1, NY = ny + 1;
  const nodeOf = new Int32Array(NX * NY * (nz + 1)).fill(-1);

    }

}

// ---------- The pile ----------
// Steps every awake fish in lock-step substeps and resolves fish-to-fish contacts between them.
// A fish that has been still for a moment goes to sleep (costs nothing) until something moving comes near it.
const CONTACT_FR = 0.3, SLEEP_SPEED = 0.06, SLEEP_AFTER = 0.7, WAKE_SPEED = 0.15;
class World {
  constructor() { this.fish = []; this.substeps = 8; this.pairs = new Int32Array(1 << 16); this.np = 0; }
  // Candidate contact pairs between nodes of different fish, refreshed a few times a frame.
  findPairs(reach) {
    const F = this.fish, nF = F.length; this.np = 0;
    const RMAX = 0.11, M = 2 * RMAX + reach, cs = M, inv = 1 / cs;
    for (const f of F) f.bounds();
    for (let a = 0; a < nF; a++) for (let b = a + 1; b < nF; b++) {
      const fa = F[a], fb = F[b]; if (fa.asleep && fb.asleep) continue;
      const A = fa.bb, B = fb.bb;
      const lo0 = Math.max(A[0], B[0]) - M, lo1 = Math.max(A[1], B[1]) - M, lo2 = Math.max(A[2], B[2]) - M;
      const hi0 = Math.min(A[3], B[3]) + M, hi1 = Math.min(A[4], B[4]) + M, hi2 = Math.min(A[5], B[5]) + M;
      if (lo0 > hi0 || lo1 > hi1 || lo2 > hi2) continue;
      // something moving came close: wake the sleeper so the pile can react
      if (fa.asleep && fb.speed > WAKE_SPEED) fa.wake();
      if (fb.asleep && fa.speed > WAKE_SPEED) fb.wake();
      const grid = new Map(), xb = fb.x, xa = fa.x, cb = fb.lat.cids, ca = fa.lat.cids;
      for (let j = 0; j < cb.length; j++) {
        const i = cb[j], k = i * 3, X = xb[k], Y = xb[k + 1], Z = xb[k + 2];
        if (X < lo0 || X > hi0 || Y < lo1 || Y > hi1 || Z < lo2 || Z > hi2) continue;
        const key = (Math.floor(X * inv) + 512) * 1048576 + (Math.floor(Y * inv) + 512) * 1024 + (Math.floor(Z * inv) + 512);
        const cell = grid.get(key); if (cell) cell.push(i); else grid.set(key, [i]);
      }
      if (!grid.size) continue;
      for (let j = 0; j < ca.length; j++) {
        const i = ca[j], k = i * 3, X = xa[k], Y = xa[k + 1], Z = xa[k + 2];
        if (X < lo0 || X > hi0 || Y < lo1 || Y > hi1 || Z < lo2 || Z > hi2) continue;
        const gx = Math.floor(X * inv) + 512, gy = Math.floor(Y * inv) + 512, gz = Math.floor(Z * inv) + 512;
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
          const cell = grid.get((gx + dx) * 1048576 + (gy + dy) * 1024 + (gz + dz)); if (!cell) continue;
          for (const ib of cell) {
            const q = ib * 3, ex = xb[q] - X, ey = xb[q + 1] - Y, ez = xb[q + 2] - Z;
            if (ex * ex + ey * ey + ez * ez > M * M) continue;
            if (this.np * 4 + 4 > this.pairs.length) { const g = new Int32Array(this.pairs.length * 2); g.set(this.pairs); this.pairs = g; }
            const o = this.np++ * 4; this.pairs[o] = a; this.pairs[o + 1] = i; this.pairs[o + 2] = b; this.pairs[o + 3] = ib;
          }
        }
      }
    }
  }
  solveContacts() {
    const P = this.pairs, F = this.fish;
    for (let k = 0, m = this.np * 4; k < m; k += 4) {
      const fa = F[P[k]], fb = F[P[k + 2]], i = P[k + 1], j = P[k + 3];
      const D = fa.lat.crad[i] + fb.lat.crad[j];
      const xa = fa.x, xb = fb.x, a = i * 3, b = j * 3;
      const dx = xb[b] - xa[a], dy = xb[b + 1] - xa[a + 1], dz = xb[b + 2] - xa[a + 2];
      const d2 = dx * dx + dy * dy + dz * dz; if (d2 >= D * D || d2 < 1e-12) continue;
      const wa = fa.asleep ? 0 : fa.w[i], wb = fb.asleep ? 0 : fb.w[j], ws = wa + wb; if (ws <= 0) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, nz = dz / d, c = (D - d) / ws;
      xa[a] -= nx * c * wa; xa[a + 1] -= ny * c * wa; xa[a + 2] -= nz * c * wa;
      xb[b] += nx * c * wb; xb[b + 1] += ny * c * wb; xb[b + 2] += nz * c * wb;
      // friction: cancel part of the sideways slip between the two touching points this substep
      const pa = fa.p, pb = fb.p;
      const rx = (xa[a] - pa[a]) - (xb[b] - pb[b]), ry = (xa[a + 1] - pa[a + 1]) - (xb[b + 1] - pb[b + 1]), rz = (xa[a + 2] - pa[a + 2]) - (xb[b + 2] - pb[b + 2]);
      const rn = rx * nx + ry * ny + rz * nz, tx = rx - nx * rn, ty = ry - ny * rn, tz = rz - nz * rn, s = CONTACT_FR / ws;
      xa[a] -= tx * s * wa; xa[a + 1] -= ty * s * wa; xa[a + 2] -= tz * s * wa;
      xb[b] += tx * s * wb; xb[b + 1] += ty * s * wb; xb[b + 2] += tz * s * wb;
    }
  }
  step(dt) {
    if (!(dt > 1e-5)) return;
    const F = this.fish;
    for (const f of F) if (f.asleep && f.grab) f.wake();
    const ns = this.substeps, h = dt / ns, every = 2;
    let awake = null;
    for (let s = 0; s < ns; s++) {
      if (s % every === 0) {
        let vmax = 0; for (const f of F) if (!f.asleep) vmax = Math.max(vmax, f.speed);
        this.findPairs(2 * (vmax + 1.5) * h * every + 0.02);
        awake = F.filter(f => !f.asleep);
        if (!awake.length) return;
      }
      for (const f of awake) { f.integrate(h); if (f.grab) f.solveGrab(h); f.solveEdges(h); f.solveVolumes(h); f.shapeMatch(); }
      if (this.np) this.solveContacts();
      for (const f of awake) { f.collide(); f.updateVel(h); f.dampEdges(h); f.dampRigid(h); }
    }
    for (const f of awake) {
      const v = f.v; let m = 0;
      for (let k = 0, n = f.n * 3; k < n; k += 3) { const q = v[k] * v[k] + v[k + 1] * v[k + 1] + v[k + 2] * v[k + 2]; if (q > m) m = q; }
      f.speed = Math.sqrt(m); f.dirty = true;
      if (!f.grab && f.speed < SLEEP_SPEED) { f.calm += dt; if (f.calm > SLEEP_AFTER) f.sleep(); } else f.calm = 0;
    }
  }
}

function buildFish(totalMass) {
  SDF = buildSDF(buildOutline());
  const vis = buildVisual();
  const lat = buildLattice(totalMass);
  const emb = embed(vis, lat);
  return { vis, lat, emb };
}

const WGSL_COMMON = /* wgsl */`
struct U {
  viewProj: mat4x4f,
  invViewProj: mat4x4f,
  camPos: vec4f,      // xyz, time
  res: vec4f,         // w, h, 1/w, 1/h
  albedo: vec4f,      // body colour (linear), w: show-mesh flag
  sigma: vec4f,       // absorption per unit thickness, w: cloudiness
  glow: vec4f,        // thin-region glow colour
  shadowTint: vec4f,  // tint of the light the candy lets through onto the floor
  misc: vec4f,        // x: shadow extent, y: floor y
};
@group(0) @binding(0) var<uniform> u: U;

const KEY_DIR = vec3f(-0.42, 0.84, 0.34);
const KEY_COL = vec3f(1.0, 0.96, 0.92);

fn toneMap(c: vec3f) -> vec3f {
  let k = 0.80;
  let x = max(c, vec3f(0.0));
  let over = max(x - vec3f(k), vec3f(0.0));
  let y = select(x, vec3f(k) + (1.0 - k) * (vec3f(1.0) - exp(-over / (1.0 - k))), x > vec3f(k));
  return pow(y, vec3f(1.0 / 2.2));
}

fn fullscreen(vi: u32) -> vec4f {
  let p = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u));
  return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
}
`;

const WGSL_DEFORM = /* wgsl */`
@group(0) @binding(1) var<storage, read> P: array<vec4f>;
@group(0) @binding(2) var<storage, read> Fm: array<vec4f>;
@group(0) @binding(3) var<storage, read> CC: array<u32>;

struct VIn {
  @location(0) rp: vec3f,
  @location(1) rn: vec3f,
  @location(2) uvw: vec3f,
  @location(3) cell: u32,
};
struct Def { p: vec3f, a: vec3f, b: vec3f, c: vec3f };

fn deform(uvw: vec3f, cell: u32) -> Def {
  var d: Def;
  for (var k = 0u; k < 8u; k++) {
    let idx = CC[cell * 8u + k];
    let wx = select(1.0 - uvw.x, uvw.x, (k & 1u) != 0u);
    let wy = select(1.0 - uvw.y, uvw.y, (k & 2u) != 0u);
    let wz = select(1.0 - uvw.z, uvw.z, (k & 4u) != 0u);
    let w = wx * wy * wz;
    d.p += w * P[idx].xyz;
    d.a += w * Fm[idx * 3u].xyz;
    d.b += w * Fm[idx * 3u + 1u].xyz;
    d.c += w * Fm[idx * 3u + 2u].xyz;
  }
  return d;
}
`;

// ---- Shadow (top-down occlusion splat) ----
const WGSL_SHADOW = WGSL_COMMON + WGSL_DEFORM + /* wgsl */`
struct SO { @builtin(position) pos: vec4f, @location(0) h: f32 };
@vertex fn vs(i: VIn) -> SO {
  let d = deform(i.uvw, i.cell);
  var o: SO;
  let S = u.misc.x;
  o.pos = vec4f(d.p.x / S, d.p.z / S, 0.5, 1.0);
  o.h = d.p.y - u.misc.y;
  return o;
}
@fragment fn fs(i: SO) -> @location(0) vec4f {
  let a = exp(-max(i.h, 0.0) * 3.2);
  return vec4f(a, a, a, a);
}
`;

// ---- Separable blur ----
const WGSL_BLUR = /* wgsl */`
@group(0) @binding(0) var samp: sampler;
@group(0) @binding(1) var src: texture_2d<f32>;
@group(0) @binding(2) var<uniform> dir: vec4f; // xy: texel step direction
struct BO { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) vi: u32) -> BO {
  let p = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u));
  var o: BO; o.pos = vec4f(p * 2.0 - 1.0, 0.0, 1.0); o.uv = vec2f(p.x, 1.0 - p.y); return o;
}
@fragment fn fs(i: BO) -> @location(0) vec4f {
  let w = array<f32, 5>(0.2270, 0.1945, 0.1216, 0.0541, 0.0162);
  var s = textureSampleLevel(src, samp, i.uv, 0.0).r * w[0];
  for (var k = 1; k < 5; k++) {
    let o = dir.xy * f32(k);
    s += (textureSampleLevel(src, samp, i.uv + o, 0.0).r + textureSampleLevel(src, samp, i.uv - o, 0.0).r) * w[k];
  }
  return vec4f(s, s, s, 1.0);
}
`;

// ---- Background: studio sweep + floor + contact shadow (linear, into scene texture) ----
const WGSL_BG = WGSL_COMMON + /* wgsl */`
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var shNear: texture_2d<f32>;
@group(0) @binding(3) var shFar: texture_2d<f32>;
struct BO { @builtin(position) pos: vec4f };
@vertex fn vs(@builtin(vertex_index) vi: u32) -> BO { var o: BO; o.pos = fullscreen(vi); return o; }

fn paper(ndcY: f32) -> vec3f {
  let top = vec3f(0.900, 0.835, 0.800);
  let low = vec3f(0.860, 0.785, 0.745);
  return mix(low, top, smoothstep(-1.0, 1.0, ndcY));
}

@fragment fn fs(i: BO) -> @location(0) vec4f {
  let ndc = vec2f(i.pos.x * u.res.z * 2.0 - 1.0, 1.0 - i.pos.y * u.res.w * 2.0);
  let a = u.invViewProj * vec4f(ndc, 0.0, 1.0);
  let b = u.invViewProj * vec4f(ndc, 1.0, 1.0);
  let ro = a.xyz / a.w;
  let rd = normalize(b.xyz / b.w - ro);
  var col = paper(ndc.y);
  if (rd.y < -1e-4) {
    let t = (u.misc.y - ro.y) / rd.y;
    let p = ro + rd * t;
    let r2 = dot(p.xz, p.xz);
    var fl = vec3f(0.875, 0.800, 0.760) * (1.0 + 0.07 * exp(-r2 / 3.0));
    let S = u.misc.x;
    let uv = vec2f(p.x / S * 0.5 + 0.5, 0.5 - p.z / S * 0.5);
    let inside = all(uv > vec2f(0.0)) && all(uv < vec2f(1.0));
    let near = textureSampleLevel(shNear, samp, uv, 0.0).r;
    let far = textureSampleLevel(shFar, samp, uv, 0.0).r;
    var occ = clamp(near * 0.62 + far * 0.42, 0.0, 0.9);
    occ = select(0.0, occ, inside);
    let tint = mix(vec3f(1.0), u.shadowTint.rgb, smoothstep(0.0, 0.5, occ));
    fl = fl * mix(vec3f(1.0), tint, occ) * (1.0 - occ * 0.35);
    col = mix(fl, col, smoothstep(5.0, 16.0, t));
  }
  return vec4f(col, 1.0);
}
`;

// ---- Copy scene texture to MSAA target (tonemapped) ----
const WGSL_COPY = WGSL_COMMON + /* wgsl */`
@group(1) @binding(0) var scene: texture_2d<f32>;
struct BO { @builtin(position) pos: vec4f };
@vertex fn vs(@builtin(vertex_index) vi: u32) -> BO { var o: BO; o.pos = fullscreen(vi); return o; }
@fragment fn fs(i: BO) -> @location(0) vec4f {
  let c = textureLoad(scene, vec2i(i.pos.xy), 0).rgb;
  // faint film grain keeps the sweep from banding
  let n = fract(sin(dot(i.pos.xy, vec2f(12.9898, 78.233))) * 43758.5453) - 0.5;
  return vec4f(toneMap(c) + n / 255.0, 1.0);
}
`;

// ---- Fish: geometry passes ----
const WGSL_FISH_VS = WGSL_COMMON + WGSL_DEFORM + /* wgsl */`
struct VOut {
  @builtin(position) pos: vec4f,
  @location(0) wp: vec3f,
  @location(1) rp: vec3f,
  @location(2) rn: vec3f,
  @location(3) f0: vec3f,
  @location(4) f1: vec3f,
  @location(5) f2: vec3f,

@vertex fn vs(i: VIn) -> VOut {

fn hash31(p: vec3f) -> f32 {
  var q = fract(p * 0.1031);
  q += dot(q, q.zyx + 31.32);
  return fract((q.x + q.y) * q.z);
}
fn hash43(p: vec3f) -> vec4f {
  var p4 = fract(vec4f(p.xyzx) * vec4f(0.1031, 0.1030, 0.0973, 0.1099));
  p4 += dot(p4, p4.wzxy + 33.33);

// The moulded "Swedish" lettering, baked to a texture (r: rounded letter height, g: wide halo that flattens the scales).

fn lettering(X: f32, W: f32, side: f32) -> vec2f {
  var u = (X - TEXT.x) / (2.0 * TEXT.z) + 0.5;

fn relief(X: f32, W: f32, side: f32) -> f32 {

  let txt = lettering(X, W, side);

  // bubbly scales: jittered lumps of uneven size and height, like a well-used mould; flattened under the lettering
  let scaleAmt = body * smoothstep(0.015, 0.06, gd) * smoothstep(-0.80, -0.35, X) * (1.0 - 0.85 * txt.g);
  if (scaleAmt > 0.001) {
    let cs = vec2f(0.078, 0.068);

  let sbx = normalize(vec3f(-0.2, 0.82, -0.54));
  let sbd = R - sbx * dot(R, sbx);
  env += vec3f(1.25, 1.2, 1.15) * smoothstep(0.0, 0.08, dot(R, sbx) - 0.80) * (1.0 - smoothstep(0.30, 0.36, abs(dot(sbd, normalize(vec3f(1.0, 0.0, 0.25))))));

  let col = body * (1.0 - Fv) + env * (0.02 + Fv * 0.6) + spec * 1.3 + sheen;
  return vec4f(toneMap(col), 1.0);
}

    const side = Math.random() < 0.5 ? 1 : -1;
    for (let i = 0; i < nP; i++) {
      const X = R[i * 3] / 1.1;
      const lift = 2.4 + 2.6 * X * X + (X < 0 ? 0.8 * -X : 0);
      const kick = side * 2.6 * Math.pow(Math.max(0, -X - 0.15), 1.4) - side * 0.5 * Math.max(0, X - 0.4);
      v[i * 3] += f.Z[0] * kick; v[i * 3 + 1] += lift + f.Z[1] * kick; v[i * 3 + 2] += f.Z[2] * kick;
    }
  }

  // ---------- The pile: pouring fish in ----------
  // A bag is mostly red: 4 red, 2 of each other flavour, shuffled.
  const BAG = ['red', 'red', 'red', 'red', 'lemon', 'lemon', 'tangerine', 'tangerine', 'lime', 'lime'];
  let pourTimers = [];
  function addFish(key) {
    if (world.fish.length >= MAX_FISH) { const old = world.fish.shift(); if (old === held) { held = null; mode = null; } detachGPU(old); }
    const f = new Jelly(lat, FLAVORS[key]);
    f.setFirmness(+firm.value / 100); f.setDamping(+damp.value / 100);
    // drop from above the pile, somewhere inside the arena, at a random heading
    f.reset({ x: (Math.random() - 0.5) * 2.4, z: (Math.random() - 0.5) * 1.4, y: 1.9 + Math.random() * 0.5,
      yaw: Math.random() * Math.PI * 2, ax: (Math.random() - 0.5) * 0.6, az: (Math.random() - 0.5) * 0.4 });
    attachGPU(f); world.fish.push(f);
    document.documentElement.style.setProperty('--accent', FLAVORS[key].css);
  }
  function pour() {
    pourTimers.forEach(clearTimeout); pourTimers = [];
    world.fish.forEach(detachGPU); world.fish = []; held = null; if (mode === 'grab') mode = null;
    const bag = BAG.slice(0, START_COUNT).sort(() => Math.random() - 0.5);
    bag.forEach((k, i) => pourTimers.push(setTimeout(() => addFish(k), i * 150)));
  }
  // Fire an action at every fish, a little apart so the pile doesn't move as one.
  const each = fn => world.fish.forEach(f => setTimeout(() => { if (!paused && world.fish.includes(f)) { f.wake(); fn(f); } }, Math.random() * 220));
  document.querySelectorAll('.swatch').forEach(b => b.addEventListener('click', () => { if (!paused) addFish(b.dataset.flavor); }));
  const firm = $('firmness'), damp = $('damping');
  const words = (v, a) => v < 0.34 ? a[0] : v < 0.67 ? a[1] : a[2];
  const syncSliders = () => {
    firm.style.setProperty('--p', firm.value + '%'); damp.style.setProperty('--p', damp.value + '%');
    world.fish.forEach(f => { f.setFirmness(+firm.value / 100); f.setDamping(+damp.value / 100); f.wake(); });
    $('firmness-val').textContent = words(+firm.value / 100, ['Soft', 'Chewy', 'Firm']);
    $('damping-val').textContent = words(+damp.value / 100, ['Jiggly', 'Balanced', 'Settled']);
  };
  firm.addEventListener('input', syncSliders); damp.addEventListener('input', syncSliders); syncSliders();
  $('btn-nudge').addEventListener('click', () => { if (!paused) each(nudge); });
  $('btn-flop').addEventListener('click', () => { if (!paused) each(flop); });
  $('btn-turn').addEventListener('click', () => { if (!paused) each(turnOver); });
  $('btn-reset').addEventListener('click', () => { pour(); });
  const pauseBtn = $('btn-pause');
  pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.setAttribute('aria-pressed', String(paused)); pauseBtn.textContent = paused ? 'Resume' : 'Pause'; if (paused && held) { held.grab = null; held = null; mode = null; } });
  $('tog-slow').addEventListener('change', e => { slow = e.target.checked; });
  $('tog-mesh').addEventListener('change', e => { showMesh = e.target.checked; });
  pour();

  // ---------- Frame ----------
  let lastT = performance.now(), frameN = 0, keSmooth = 0;
  // Camera block is shared; the flavour block is per fish. The floor gets the pile's average shadow tint.
  function writeUniforms(time) {
    uArr.set(viewProj, 0); uArr.set(invViewProj, 16);
    uArr.set([camPos[0], camPos[1], camPos[2], time], 32);
    uArr.set([W, H, 1 / W, 1 / H], 36);
    uArr.set([SH_EXT, -0.006, 0, 0], 56);
    const tint = [0, 0, 0];
    for (const f of world.fish) {
      const fl = f.flavor;
      uArr.set([...fl.albedo, showMesh ? 1 : 0], 40);
      uArr.set([...fl.sigma, 7.5], 44);
      uArr.set([...fl.glow, 0], 48);
      uArr.set([...fl.shadow, 0], 52);
      device.queue.writeBuffer(f.gpu.ub, 0, uArr);
      for (let k = 0; k < 3; k++) tint[k] += fl.shadow[k] / world.fish.length;
    }
    uArr.set([...(world.fish.length ? tint : FLAVORS.red.shadow), 0], 52);
    device.queue.writeBuffer(uBuf, 0, uArr);
  }
  let hold = false;
  function frame(now, manual) {
    if (hold && !manual) { requestAnimationFrame(frame); return; }
    const dt = Math.min((now - lastT) / 1000, 1 / 30); lastT = now;
    resize(); updateCamera();
    if (!paused) world.step(dt * (slow ? 0.25 : 1));
    for (const f of world.fish) if (f.dirty) {   // sleeping fish keep last frame's buffers
      f.writeGPU(posArr, fArr); f.dirty = false;
      device.queue.writeBuffer(f.gpu.pos, 0, posArr); device.queue.writeBuffer(f.gpu.fm, 0, fArr);
    }
    writeUniforms(now / 1000);
    // nearest first, so the depth test rejects hidden fish before their (expensive) shading
    const order = world.fish.map(f => { const b = f.bb; return { f, d: Math.hypot((b[0] + b[3]) / 2 - camPos[0], (b[1] + b[4]) / 2 - camPos[1], (b[2] + b[5]) / 2 - camPos[2]) }; })
      .sort((a, b) => a.d - b.d).map(o => o.f);
    const drawAll = p => { p.setVertexBuffer(0, vbuf); p.setIndexBuffer(ibuf, 'uint32'); for (const f of order) { p.setBindGroup(0, f.gpu.group); p.drawIndexed(vis.idx.length); } };

    const enc = device.createCommandEncoder();
    let pass = enc.beginRenderPass({ colorAttachments: [{ view: shTex[0].createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }] });
    pass.setPipeline(pShadow); drawAll(pass); pass.end();
    [[0, 1], [1, 2], [2, 3], [3, 4]].forEach(([s, d], k) => {
      const p = enc.beginRenderPass({ colorAttachments: [{ view: shTex[d].createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
      p.setPipeline(pBlur); p.setBindGroup(0, blurGroups[k]); p.draw(3); p.end();
    });
    pass = enc.beginRenderPass({ colorAttachments: [{ view: tex.scene.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
    pass.setPipeline(pBg); pass.setBindGroup(0, bgGroup); pass.draw(3); pass.end();
    pass = enc.beginRenderPass({ colorAttachments: [{ view: tex.back.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [100, 0, 0, 1] }],
      depthStencilAttachment: { view: tex.backDepth.createView(), depthLoadOp: 'clear', depthStoreOp: 'discard', depthClearValue: 1 } });
    pass.setPipeline(pBack); drawAll(pass); pass.end();
    pass = enc.beginRenderPass({ colorAttachments: [{ view: tex.msColor.createView(), resolveTarget: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'discard', clearValue: [0.95, 0.92, 0.9, 1] }],
      depthStencilAttachment: { view: tex.msDepth.createView(), depthLoadOp: 'clear', depthStoreOp: 'discard', depthClearValue: 1 } });
    pass.setPipeline(pCopy); pass.setBindGroup(0, geomGroup); pass.setBindGroup(1, tex.sceneGroup); pass.draw(3);
    pass.setPipeline(pFish); pass.setBindGroup(1, tex.fishGroup); drawAll(pass);
    if (showMesh) { pass.setPipeline(pLines); pass.setIndexBuffer(lineBuf, 'uint32'); for (const f of order) { pass.setBindGroup(0, f.gpu.group); pass.drawIndexed(lat.lines.length); } }
    pass.end();
    device.queue.submit([enc.finish()]);

    if (frameN++ % 6 === 0) {
      let ke = 0; for (const f of world.fish) if (!f.asleep) ke += f.kinetic() * 0.4;
      keSmooth = keSmooth * 0.5 + ke * 0.5;
      $('ro-count').textContent = world.fish.length;
      $('ro-mass').textContent = (massG * world.fish.length).toFixed(1) + ' g';
      $('ro-ke').textContent = (keSmooth < 0.05 ? 0 : keSmooth).toFixed(keSmooth < 10 ? 2 : 1) + ' µJ';
    }
    if (!manual) requestAnimationFrame(frame);
  }
  window.__fish = { world, cam, nudge, flop, turnOver, pick, rayFrom, startGrab, moveGrab, addFish, pour, get paused() { return paused; }, setHold(v) { hold = v; }, renderOnce(dt = 1 / 60) { lastT = performance.now() - dt * 1000; frame(performance.now(), true); return device.queue.onSubmittedWorkDone(); }, stepSim(n, dt = 1 / 60) { for (let i = 0; i < n; i++) world.step(dt); } };
  requestAnimationFrame(frame);
})();

</script>
